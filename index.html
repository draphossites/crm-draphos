<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRAPHOS CRM</title><link rel="stylesheet" href="style.css"><body><aside><h2>DRAPHOS<span>AGENCY MANAGER</span></h2><nav id="nav"></nav><small>Gestão de agência</small></aside><main><header><div><small>ESPAÇO DE TRABALHO</small><h1 id="title"></h1></div><button id="new">+ Novo registro</button></header><section id="view"></section></main><dialog id="modal"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><footer><button type="button" id="cancel" class="secondary">Cancelar</button><button>Salvar</button></footer></form></dialog><dialog id="followModal"><form id="followForm"><h2></h2><input type="hidden" id="followId"><label for="response">Situação da resposta</label><select id="response"><option>Aguardando resposta</option><option>Respondeu</option><option>Não respondeu</option></select><label for="followDate">Data do próximo contato</label><input type="date" id="followDate"><div class="toolbar" style="margin-top:10px"><button type="button" class="secondary" onclick="document.getElementById('followDate').value=localDay(1)">Amanhã</button><button type="button" class="secondary" onclick="document.getElementById('followDate').value=localDay(3)">Em 3 dias</button><button type="button" class="secondary" onclick="document.getElementById('followDate').value=localDay(7)">Em 7 dias</button></div><label for="followNote">Observações do atendimento</label><textarea id="followNote" rows="3"></textarea><label><input type="checkbox" id="createTask" style="width:auto"> Criar ou atualizar tarefa de retorno</label><footer><button type="button" class="secondary" onclick="document.getElementById('followModal').close()">Cancelar</button><button>Salvar resposta</button></footer></form></dialog><script src="importer.js"></script><script src="app.js"></script></body></html>
